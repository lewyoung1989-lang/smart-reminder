map $http_x_request_id $smart_request_id {
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
    default $request_id;
}

log_format smart_reminder
    'time=$time_iso8601 level=INFO request_id=$smart_request_id method=$request_method '
    'path=$uri status=$status bytes=$body_bytes_sent '
    'request_time=$request_time upstream_time=$upstream_response_time';

error_log /dev/stderr crit;

server {
    listen 80;
    server_name aipupu.cloud files.aipupu.cloud;
    access_log /dev/stdout smart_reminder;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.aipupu.cloud;
    access_log /dev/stdout smart_reminder;

    ssl_certificate /etc/letsencrypt/live/aipupu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipupu.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 9m;
    resolver 127.0.0.11 ipv6=off valid=30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $smart_request_id always;

    location / {
        limit_except PUT {
            deny all;
        }
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $smart_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aipupu.cloud;
    access_log /dev/stdout smart_reminder;

    ssl_certificate /etc/letsencrypt/live/aipupu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipupu.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $smart_request_id always;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $smart_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
