map $http_x_request_id $smart_request_id {
    default $http_x_request_id;
    "" $request_id;
}

log_format smart_reminder
    'time=$time_iso8601 request_id=$smart_request_id method=$request_method '
    'path=$uri status=$status bytes=$body_bytes_sent '
    'request_time=$request_time upstream_time=$upstream_response_time';

access_log /dev/stdout smart_reminder;
error_log /dev/stderr warn;

server {
    listen 80;
    server_name aipupu.cloud files.aipupu.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.aipupu.cloud;

    ssl_certificate /etc/letsencrypt/live/aipupu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipupu.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_except PUT {
            deny all;
        }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $smart_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aipupu.cloud;

    ssl_certificate /etc/letsencrypt/live/aipupu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipupu.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $smart_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
