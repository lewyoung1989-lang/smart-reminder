x-logging: &production_logging
  driver: journald

x-backend-environment: &production_backend_environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-aipupu.cloud}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://aipupu.cloud}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-3600}
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
  POSTGRES_DB: ${POSTGRES_DB:-smart_reminder}
  POSTGRES_USER: ${POSTGRES_USER:-smart_reminder}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  AUTH_CACHE_URL: ${AUTH_CACHE_URL:-redis://redis:6379/4}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-8}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OCR_ENABLED: ${OCR_ENABLED:-false}
  ASR_PROVIDER: ${ASR_PROVIDER:-funasr}
  ASR_BASE_URL: ${ASR_BASE_URL:-http://funasr:8000}
  ASR_LEASE_PROVIDER: ${ASR_LEASE_PROVIDER:-redis}
  ASR_MODEL: ${ASR_MODEL:-paraformer-zh}
  ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-75}
  ASR_MAX_AUDIO_BYTES: ${ASR_MAX_AUDIO_BYTES:-4194304}
  ASR_MAX_REQUEST_BYTES: ${ASR_MAX_REQUEST_BYTES:-5242880}
  ASR_MIN_DURATION_SECONDS: ${ASR_MIN_DURATION_SECONDS:-0.3}
  ASR_MAX_DURATION_SECONDS: ${ASR_MAX_DURATION_SECONDS:-60}
  ASR_GLOBAL_CONCURRENCY: ${ASR_GLOBAL_CONCURRENCY:-1}
  ASR_CONCURRENCY_PER_USER: ${ASR_CONCURRENCY_PER_USER:-1}
  ASR_LEASE_TTL_SECONDS: ${ASR_LEASE_TTL_SECONDS:-90}
  ASR_USER_RATE: ${ASR_USER_RATE:-10/min}
  ASR_IP_RATE: ${ASR_IP_RATE:-30/min}
  ASR_REDIS_URL: ${ASR_REDIS_URL:-redis://redis:6379/0}
  ASR_THROTTLE_REDIS_URL: ${ASR_THROTTLE_REDIS_URL:-redis://redis:6379/2}
  ASR_TRUSTED_PROXY_IPS: ${ASR_TRUSTED_PROXY_IPS:-172.29.0.10}

x-ocr-environment: &production_ocr_environment
  <<: *production_backend_environment
  OCR_PROVIDER: ${OCR_PROVIDER:-rapidocr}
  OCR_STORAGE_PROVIDER: ${OCR_STORAGE_PROVIDER:-s3}
  OCR_JOB_RETENTION_HOURS: ${OCR_JOB_RETENTION_HOURS:-24}
  OCR_QUEUE: ${OCR_QUEUE:-ocr}
  OCR_SEMANTIC_PROVIDER: ${OCR_SEMANTIC_PROVIDER:-deepseek}
  OCR_SEMANTIC_TIMEOUT_SECONDS: ${OCR_SEMANTIC_TIMEOUT_SECONDS:-8}
  OCR_DEBUG_TEXT_LOGGING: ${OCR_DEBUG_TEXT_LOGGING:-false}
  S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://files.aipupu.cloud}
  S3_BUCKET: ${S3_BUCKET:-smart-reminder-private}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/postgres

  redis:
    ports: !reset []
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/redis

  minio:
    ports: !reset []
    profiles: [ocr]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/minio
    networks:
      default: {}
      asr_proxy: {}

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "/config/init_minio.sh"]
    environment:
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-smart-reminder-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - ./deploy/tencent/scripts/init_minio.sh:/config/init_minio.sh:ro
      - ./deploy/tencent/minio/app-policy.json:/config/app-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    profiles: [ocr]
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/minio-init

  api:
    image: smart-reminder-api:${APP_VERSION:?APP_VERSION is required}
    ports: !reset []
    environment: *production_ocr_environment
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 2 --timeout 90 --access-logfile - --error-logfile -
      --access-logformat
      'level=INFO request_id=%({x-request-id}i)s method=%(m)s path=%(U)s status=%(s)s bytes=%(b)s duration_us=%(D)s'
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/api
    networks:
      default: {}
      asr_proxy: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/v1/health', headers={'Host':'aipupu.cloud','X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(request, timeout=3).status == 200"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on: !reset []

  funasr-model-init:
    image: smart-reminder-funasr:${APP_VERSION:?APP_VERSION is required}
    environment:
      MODELSCOPE_CACHE: /models
      HF_HOME: /models/huggingface
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    cpus: 1.5
    mem_reservation: 1400m
    mem_limit: 2600m
    pids_limit: 256
    restart: "no"
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/funasr-model-init

  funasr:
    image: smart-reminder-funasr:${APP_VERSION:?APP_VERSION is required}
    ports: !reset []
    environment:
      MODELSCOPE_CACHE: /models
      HF_HOME: /models/huggingface
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    command: >-
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 1 --no-access-log
    volumes:
      - type: volume
        source: funasr_models
        target: /models
        read_only: true
    cpus: 1.5
    mem_reservation: 1400m
    mem_limit: 2600m
    pids_limit: 256
    depends_on: !reset []
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/funasr
    networks:
      asr_proxy: {}

  worker:
    image: smart-reminder-api:${APP_VERSION:?APP_VERSION is required}
    environment: *production_backend_environment
    command: >-
      celery -A config worker -Q celery --concurrency=1
      --prefetch-multiplier=1 --loglevel=INFO
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/worker

  ocr-worker:
    image: smart-reminder-ocr:${APP_VERSION:?APP_VERSION is required}
    ports: !reset []
    profiles: [ocr]
    environment: *production_ocr_environment
    command: celery -A config worker -Q ocr --concurrency=1 --prefetch-multiplier=1 --loglevel=INFO
    cpus: 1.0
    mem_reservation: 700m
    mem_limit: 1200m
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/ocr-worker

  beat:
    image: smart-reminder-api:${APP_VERSION:?APP_VERSION is required}
    environment: *production_backend_environment
    profiles: [ocr]
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/beat

  nginx-bootstrap:
    image: nginx:1.27-alpine
    profiles: [bootstrap]
    ports:
      - "80:80"
    volumes:
      - ./deploy/tencent/nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/nginx-bootstrap

  nginx:
    image: nginx:1.27-alpine
    profiles: [production]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/tencent/nginx/aipupu.cloud.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_etc:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/nginx
    networks:
      asr_proxy:
        ipv4_address: 172.29.0.10

  nginx-check:
    image: nginx:1.27-alpine
    profiles: [production]
    volumes:
      - ./deploy/tencent/nginx/aipupu.cloud.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_etc:/etc/letsencrypt:ro
    restart: "no"
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/nginx-check
    networks:
      asr_proxy: {}

  certbot:
    image: certbot/certbot:v4.1.1
    profiles: [certbot]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    logging:
      <<: *production_logging
      options:
        tag: smart-reminder/certbot

volumes:
  certbot_www:
  certbot_etc:

networks:
  asr_proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
