name: smart_reminder_app
description: Smart reminder and family medicine management app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.1.15
  flutter_local_notifications: ^22.2.0
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
