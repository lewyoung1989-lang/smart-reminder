services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_reminder}
      POSTGRES_USER: ${POSTGRES_USER:-smart_reminder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_reminder} -d ${POSTGRES_DB:-smart_reminder}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smart-reminder}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment: &backend_environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-smart_reminder}
      POSTGRES_USER: ${POSTGRES_USER:-smart_reminder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ASR_BASE_URL: http://funasr:8000
      ASR_REDIS_URL: redis://redis:6379/0
      ASR_THROTTLE_REDIS_URL: redis://redis:6379/2
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      funasr:
        condition: service_healthy

  funasr-model-init:
    build:
      context: .
      dockerfile: services/funasr/Dockerfile
    command: python -m app.download_models
    environment:
      MODELSCOPE_CACHE: /models
      HF_HOME: /models/huggingface
    volumes:
      - funasr_models:/models
    restart: "no"

  funasr:
    build:
      context: .
      dockerfile: services/funasr/Dockerfile
    environment:
      MODELSCOPE_CACHE: /models
      HF_HOME: /models/huggingface
    volumes:
      - type: volume
        source: funasr_models
        target: /models
        read_only: true
    restart: unless-stopped
    depends_on:
      funasr-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 120s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend_environment
    command: celery -A config worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend_environment
    command: celery -A config beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  funasr_models:
  postgres_data:
  minio_data:
